[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamcal"
version = "0.1.0"
description = "Streaming probability calibration via multiplicative weights"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood" }]
keywords = ["calibration", "probability", "streaming", "machine-learning", "mwu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/soodoku/mw-calibration"
Repository = "https://github.com/soodoku/mw-calibration"
Documentation = "https://soodoku.github.io/mw-calibration"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
docs = ["sphinx", "furo", "myst-parser"]
experiments = ["pandas", "matplotlib", "lightgbm"]

[tool.hatch.build.targets.wheel]
packages = ["src/streamcal"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true
