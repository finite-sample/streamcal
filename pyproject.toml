[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamcal"
version = "0.2.0"
description = "Streaming probability calibration for ML models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood" }]
keywords = ["calibration", "probability", "streaming", "machine-learning", "isotonic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/finite-sample/streamcal"
Repository = "https://github.com/finite-sample/streamcal"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
docs = ["sphinx", "furo", "myst-parser"]

[dependency-groups]
test = [
    "pytest",
    # Monte Carlo test machinery. A dependency-group, not an extra: PyPI rejects
    # direct URL references in published project metadata.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamcal"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true
