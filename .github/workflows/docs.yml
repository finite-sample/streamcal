name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: gojiplus/py-canon/.github/workflows/reusable-docs.yml@d30ecea5004bec9d1473fea556c82dce6daef981 # v1.3.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy: ${{ github.event_name == 'push' }}
