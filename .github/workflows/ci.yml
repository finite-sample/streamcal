name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@d30ecea5004bec9d1473fea556c82dce6daef981 # v1.3.0
    with:
      # Canon's default matrix is ["3.11", "3.14"]; requires-python floors at
      # 3.12, so the 3.11 leg cannot resolve.
      python-versions: '["3.12", "3.14"]'
      wheel-import: streamcal
      coverage-floor: 96
      run-preen: true
